<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>About Maillet</title>
<link rel="stylesheet" href="kit/sx.css">
<script src="look-early.js"></script>
<script type="module" src="look.js"></script>
<style>
/* Colours come from the be spex kit (kit/sx.css, roles --sx-*), chosen in the settings (look.js). */
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; }
body { font-family:"Inter","Segoe UI",Roboto,"Noto Sans",sans-serif; background:var(--sx-bg); color:var(--sx-ink);
       display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; text-align:center; padding:20px; }
img { width:96px; height:96px; margin-bottom:10px; }
h1 { font-size:20px; font-weight:650; }
.short { color:var(--sx-ink-2); font-size:13px; font-style:italic; }
.version { margin-top:8px; font-size:13px; padding:3px 10px; border:1px solid var(--sx-line); border-radius:999px; }
p { margin-top:12px; font-size:12px; color:var(--sx-ink-2); max-width:280px; line-height:1.45; }
</style>
</head>
<body>
  <img src="icon.png" alt="">
  <h1 id="name">Maillet</h1>
  <div class="short" id="tagline">your one-time password helper</div>
  <div class="version">Version <span id="version">–</span></div>
  <p>Watches your IMAP mailboxes for authentication codes and shows them instantly.</p>
<script>
(async () => {
  const core = window.__TAURI__ && window.__TAURI__.core
  if (!core) return
  // keyup: after the window is re-shown, WebKitGTK drops the first keydown.
  document.addEventListener('keyup', ev => { if (ev.key === 'Escape') core.invoke('hide_window') })
  const info = await core.invoke('get_app_info')
  document.getElementById('name').textContent = info.name
  document.getElementById('tagline').textContent = info.tagline
  document.getElementById('version').textContent = info.version
})()
</script>
</body>
</html>
